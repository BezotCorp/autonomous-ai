[package]
name = "autonomous-ai"
version = "0.1.0"
edition = "2024"
description = "Autonomous artificial intelligence"
license = "Apache-2.0"
repository = "https://github.com/BezotCorp/autonomous-ai"
readme = "README.md"
publish = true

[dependencies]
bincode-next = { version = "3.2.0", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
fs2 = "0.4.3"
proc-macro2 = "1.0.107"
quote = "1.0.47"
ron = "0.12.3"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.10", features = ["full"] }
tempfile = "3.27.0"
toml = "1.2.3"
trustfall = "0.8.1"
trustfall-rustdoc-adapter = "61"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
zstd = "0.14.5"
